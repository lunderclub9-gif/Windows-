<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#111C2D"/>
      <stop offset="100%" stop-color="#0B2E26"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8"/>

  <!-- Subtle Inner Documentary Frame -->
  <rect x="64" y="96" width="384" height="320" rx="36" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-opacity="0.35"/>

  <!-- Film Perforations Top & Bottom -->
  <rect x="96" y="114" width="36" height="16" rx="6" fill="#34D399" fill-opacity="0.5"/>
  <rect x="164" y="114" width="36" height="16" rx="6" fill="#34D399" fill-opacity="0.5"/>
  <rect x="238" y="114" width="36" height="16" rx="6" fill="#34D399" fill-opacity="0.5"/>
  <rect x="312" y="114" width="36" height="16" rx="6" fill="#34D399" fill-opacity="0.5"/>
  <rect x="380" y="114" width="36" height="16" rx="6" fill="#34D399" fill-opacity="0.5"/>

  <rect x="96" y="382" width="36" height="16" rx="6" fill="#34D399" fill-opacity="0.5"/>
  <rect x="164" y="382" width="36" height="16" rx="6" fill="#34D399" fill-opacity="0.5"/>
  <rect x="238" y="382" width="36" height="16" rx="6" fill="#34D399" fill-opacity="0.5"/>
  <rect x="312" y="382" width="36" height="16" rx="6" fill="#34D399" fill-opacity="0.5"/>
  <rect x="380" y="382" width="36" height="16" rx="6" fill="#34D399" fill-opacity="0.5"/>

  <!-- Central Play + Documentary Lens Circle -->
  <circle cx="256" cy="256" r="88" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="12"/>
  <path d="M 232 212 L 304 256 L 232 300 Z" fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Accent Spark / Quill Dot -->
  <circle cx="348" cy="176" r="14" fill="url(#emeraldGrad)"/>
</svg>
