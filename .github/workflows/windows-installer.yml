name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "installer/**"
      - "documaker_dz/**"
  pull_request:
    paths:
      - ".github/workflows/windows-installer.yml"
      - "installer/**"
      - "documaker_dz/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: documaker_dz/requirements.txt

      - name: Download LGPL FFmpeg
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-lgpl.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg-lgpl"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          $downloaded = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Remove-Item $archive -Force -ErrorAction SilentlyContinue
              curl.exe -fL --retry 2 --retry-all-errors --connect-timeout 30 --max-time 600 -A "DocuMakerDZ-Windows-Builder" $url -o $archive
              if ($LASTEXITCODE -ne 0) { throw "FFmpeg download returned exit code $LASTEXITCODE." }
              $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
              $hasFfmpeg = @($zip.Entries | Where-Object { $_.FullName -match '(^|/)ffmpeg.exe$' }).Count -gt 0
              $hasFfprobe = @($zip.Entries | Where-Object { $_.FullName -match '(^|/)ffprobe.exe$' }).Count -gt 0
              $zip.Dispose()
              if (-not ($hasFfmpeg -and $hasFfprobe)) { throw "Downloaded file is not the expected FFmpeg ZIP archive." }
              $downloaded = $true
              break
            } catch {
              Write-Warning "FFmpeg download attempt $attempt failed: $_"
              if ($attempt -lt 4) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          if (-not $downloaded) { throw "Unable to download a valid LGPL FFmpeg archive after 4 attempts." }
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries were not found after extraction." }
          New-Item -ItemType Directory -Force -Path "documaker_dz/bin" | Out-Null
          Copy-Item $ffmpeg.FullName "documaker_dz/bin/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "documaker_dz/bin/ffprobe.exe"
          $license = Get-ChildItem -Path $extract -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING)(\..*)?$' } | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName "documaker_dz/bin/FFmpeg-LICENSE.txt" }
          "documaker_dz/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify bundled FFmpeg capabilities
        shell: pwsh
        run: |
          $encoders = & "documaker_dz/bin/ffmpeg.exe" -hide_banner -encoders 2>&1 | Out-String
          if ($encoders -notmatch '(?m)^\s*V\S+\s+mpeg4\s') { throw "The bundled FFmpeg build does not include the required mpeg4 encoder." }
          $filters = & "documaker_dz/bin/ffmpeg.exe" -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch '\bass\b') { throw "The bundled FFmpeg build does not include the ASS subtitle filter." }
          Write-Host "FFmpeg has the mpeg4 encoder and ASS subtitle filter."

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r documaker_dz/requirements.txt

      - name: Run automated tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s documaker_dz/tests -v

      - name: Build standalone Windows executable
        working-directory: documaker_dz
        run: pyinstaller --clean --noconfirm documaker.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $programFiles = [Environment]::GetFolderPath("ProgramFiles")
          $candidates = @(
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
            (Join-Path $programFiles "Inno Setup 6\ISCC.exe")
          )
          $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $isccPath) { throw "Inno Setup compiler ISCC.exe was not found. Checked: $($candidates -join '; ')" }
          & $isccPath "installer\DocuMakerDZ.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-Item "installer-output/DocuMakerDZ-Setup-0.1.2.exe"
          if ($installer.Length -lt 10MB) { throw "Installer is unexpectedly small." }
          Write-Host "Installer ready: $($installer.FullName), $($installer.Length) bytes"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          name: DocuMaker DZ 0.1.0 - Windows Installer
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: installer-output/DocuMakerDZ-Setup-0.1.2.exe
