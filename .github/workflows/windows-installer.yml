name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "installer/**"
      - "documaker_dz/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: documaker_dz/requirements.txt

      - name: Download LGPL FFmpeg
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-lgpl.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg-lgpl"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries were not found in the downloaded archive." }
          New-Item -ItemType Directory -Force -Path "documaker_dz/bin" | Out-Null
          Copy-Item $ffmpeg.FullName "documaker_dz/bin/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "documaker_dz/bin/ffprobe.exe"
          $license = Get-ChildItem -Path $extract -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING)(\\..*)?$' } | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName "documaker_dz/bin/FFmpeg-LICENSE.txt" }
          "documaker_dz/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify bundled FFmpeg capabilities
        shell: pwsh
        run: |
          $encoders = & "documaker_dz/bin/ffmpeg.exe" -hide_banner -encoders 2>&1 | Out-String
          if ($encoders -notmatch "\bmpeg4\b") { throw "The bundled FFmpeg build does not include the required mpeg4 encoder." }
          $filters = & "documaker_dz/bin/ffmpeg.exe" -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch "\bass\b") { throw "The bundled FFmpeg build does not include the ASS subtitle filter." }
          Write-Host "FFmpeg has the mpeg4 encoder and ASS subtitle filter."

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r documaker_dz/requirements.txt

      - name: Run automated tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s documaker_dz/tests -v

      - name: Build standalone Windows executable
        working-directory: documaker_dz
        run: pyinstaller --clean --noconfirm documaker.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ProgramFiles(x86)\\Inno Setup 6\\ISCC.exe" "installer\\DocuMakerDZ.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-Item "installer-output/DocuMakerDZ-Setup-0.1.0.exe"
          if ($installer.Length -lt 10MB) { throw "Installer is unexpectedly small." }
          Write-Host "Installer ready: $($installer.FullName), $($installer.Length) bytes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: DocuMaker DZ 0.1.0 - Windows Installer
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: installer-output/DocuMakerDZ-Setup-0.1.0.exe
